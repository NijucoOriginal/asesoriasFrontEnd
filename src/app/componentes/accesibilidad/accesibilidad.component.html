<button class="accessibility-btn" type="button" (click)="MostrarMenu()"
        [attr.aria-expanded]="menuVisible" [attr.aria-label]="t.accesibilidad.titulo">
  <i class="bi" [class.bi-universal-access-circle]="!menuVisible" [class.bi-x-lg]="menuVisible"></i>
</button>

@if (menuVisible) {
  <section class="accessibility-menu" role="dialog" [attr.aria-label]="t.accesibilidad.titulo">
    <header class="menu-header">
      <h2 class="menu-title"><i class="bi bi-universal-access"></i> {{ t.accesibilidad.titulo }}</h2>
      <button type="button" class="btn-cerrar" (click)="MostrarMenu()" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button>
    </header>

    <!-- Tamaño de texto -->
    <div class="bloque">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <label for="textSize" class="etiqueta">{{ t.accesibilidad.tamanoTexto }}</label>
        <span class="valor">{{ (zoom * 100) | number: '1.0-0' }}%</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn-zoom" (click)="cambiarZoom(-0.1)" [disabled]="zoom <= 0.8" aria-label="Reducir texto">A−</button>
        <input id="textSize" type="range" class="form-range" min="0.8" max="1.5" step="0.1" [(ngModel)]="zoom" (input)="actualizarZoom()">
        <button type="button" class="btn-zoom grande" (click)="cambiarZoom(0.1)" [disabled]="zoom >= 1.5" aria-label="Aumentar texto">A+</button>
      </div>
    </div>

    <!-- Modo oscuro -->
    <label class="bloque fila-switch" for="oscuroSwitch">
      <span><i class="bi" [class.bi-moon-stars-fill]="modoOscuro" [class.bi-sun-fill]="!modoOscuro"></i> {{ t.accesibilidad.modoOscuro }}</span>
      <span class="form-check form-switch m-0">
        <input id="oscuroSwitch" class="form-check-input" type="checkbox" role="switch" [(ngModel)]="modoOscuro" (change)="CambiarModoOscuro()">
      </span>
    </label>

    <!-- Alto contraste -->
    <label class="bloque fila-switch" for="contrasteSwitch">
      <span><i class="bi bi-circle-half"></i> {{ t.accesibilidad.altoContraste }}</span>
      <span class="form-check form-switch m-0">
        <input id="contrasteSwitch" class="form-check-input" type="checkbox" role="switch" [(ngModel)]="altoContraste" (change)="CambiarContraste()">
      </span>
    </label>

    <!-- Idioma -->
    <div class="bloque">
      <span class="etiqueta d-block mb-2"><i class="bi bi-translate"></i> {{ t.accesibilidad.idioma }}</span>
      <div class="language-buttons">
        <button type="button" class="lang-btn" [class.active]="idiomaSeleccionado === 'es'" (click)="cambiarIdioma('es')">{{ t.accesibilidad.espanol }}</button>
        <button type="button" class="lang-btn" [class.active]="idiomaSeleccionado === 'en'" (click)="cambiarIdioma('en')">{{ t.accesibilidad.ingles }}</button>
      </div>
    </div>

    <button type="button" class="btn btn-light btn-sm w-100" (click)="restablecer()">
      <i class="bi bi-arrow-counterclockwise me-1"></i> Restablecer
    </button>
  </section>
}
